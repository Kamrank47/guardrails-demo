name: guardrails
on:
  pull_request:
    paths: ["terraform/**", "policy/**"]
permissions:
  contents: read
  pull-requests: write
jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [terraform/good, terraform/ai-draft]
    # ai-draft is expected to fail: it proves the gate works.
    continue-on-error: ${{ matrix.dir == 'terraform/ai-draft' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Static scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.dir }}
          exit-code: "1"
          severity: HIGH,CRITICAL
      - name: Plan
        if: ${{ !cancelled() }}
        working-directory: ${{ matrix.dir }}
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          TF_VAR_db_password: ci-placeholder
        run: |
          terraform init -backend=false
          terraform plan -refresh=false -out=plan.out \
            -input=false
          terraform show -json plan.out > plan.json
      - name: Install Conftest
        if: ${{ !cancelled() }}
        run: |
          curl -sSfL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar xz conftest
      - name: Policy gate (OPA / Conftest)
        if: ${{ !cancelled() }}
        run: ./conftest test ${{ matrix.dir }}/plan.json --policy policy
